name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contracts:
    name: Contracts (Foundry + Slither)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v4
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - name: Run forge build
        run: forge build
      - name: Run forge test
        run: forge test -vvv

  typescript:
    name: TypeScript (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9.0.0"
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @arcswarm/api db:generate
      - name: Build all packages
        run: pnpm run build
      - name: Test shared
        run: pnpm --filter @arcswarm/shared test
      - name: Test API
        run: pnpm --filter @arcswarm/api test
      - name: Test agents
        run: pnpm --filter @arcswarm/agents test
      - name: Test dashboard
        run: pnpm --filter @arcswarm/dashboard test
