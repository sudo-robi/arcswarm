replicaCount: 2

image:
  repository: ghcr.io/arcswarm/arcswarm-api
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 3001

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "60s"
  hosts:
    - host: api.arcswarm.xyz
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: arcswarm-api-tls
      hosts:
        - api.arcswarm.xyz

resources:
  limits:
    memory: "512Mi"
    cpu: "500m"
  requests:
    memory: "256Mi"
    cpu: "250m"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

env:
  - name: NODE_ENV
    value: "production"
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: arcswarm-secrets
        key: database-url
  - name: SENTRY_DSN
    valueFrom:
      secretKeyRef:
        name: arcswarm-secrets
        key: sentry-dsn

healthChecks:
  enabled: true
  livenessProbe:
    httpGet:
      path: /api/health
      port: 3001
    initialDelaySeconds: 15
    periodSeconds: 20
  readinessProbe:
    httpGet:
      path: /api/health
      port: 3001
    initialDelaySeconds: 5
    periodSeconds: 10

networkPolicy:
  enabled: true
  allowExternal: true
  allowedNamespaces:
    - monitoring
  allowedPorts:
    - port: 5432
      protocol: TCP
      namespace: database

podDisruptionBudget:
  enabled: true
  minAvailable: 1
